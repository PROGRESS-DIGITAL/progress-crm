# Рабочий стенд: PostgreSQL, CRM и Caddy с автоматическим HTTPS
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_DB: progress_crm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d progress_crm"]
      interval: 5s
      retries: 10

  app:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@db:5432/progress_crm
      TILDA_WEBHOOK_KEY: ${TILDA_WEBHOOK_KEY:?задайте TILDA_WEBHOOK_KEY в deploy/.env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-0}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  # Ежедневная копия базы в deploy/backups, хранится 14 дней
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U crm progress_crm | gzip > /backups/crm-$$(date +%F).sql.gz;
        find /backups -name "crm-*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  db-data:
  caddy-data:
