services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Общая сеть с базой: PostgreSQL доступен на localhost:5432
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: progress_crm
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
